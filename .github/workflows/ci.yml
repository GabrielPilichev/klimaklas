name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend – тестове и линтер
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: klimaklas
          POSTGRES_USER: klimaklas
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff (стил и проверки за сигурност)
        run: ruff check . && ruff format --check .
      - name: Pytest (SQLite)
        run: pytest -v
      - name: Демо данни върху PostgreSQL
        env:
          KK_DATABASE_URL: postgresql+psycopg://klimaklas:ci@localhost:5432/klimaklas
        run: python -m app.seed --days 2

  gateway:
    name: Шлюз – тестове
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -v test_gateway.py

  frontend:
    name: Frontend – сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  firmware:
    name: Фърмуер – компилация
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: cp include/secrets.example.h include/secrets.h
      - run: pio run -e esp32s3
