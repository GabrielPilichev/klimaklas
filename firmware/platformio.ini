; КлимаКлас – фърмуер за сензорен възел
; Платка: Waveshare ESP32-S3 DEV KIT N16R8 (16 MB flash, 8 MB PSRAM)
; Сензор: DFRobot SEN0678 (Sensirion STCC4 + SHT40), I²C
; Дисплей: OLED 0.91" 128×32 SSD1306, I²C

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    sensirion/Sensirion I2C STCC4@^1.0.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8

; Алтернатива: класически ESP32 DevKit + SCD41 (както в първоначалното предложение)
[env:esp32-scd41]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DSENSOR_SCD41
    -DSENSOR_SDA=21
    -DSENSOR_SCL=22
    -DOLED_SDA=21
    -DOLED_SCL=22
lib_deps =
    sensirion/Sensirion I2C SCD4x@^1.1.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8
